# Nice Polyglot — Configuration Template
# Copy this file to one (or more) of the following paths to override language settings:
#
#   Extension layer  (shared across all projects in a shared .specify/ root):
#     .specify/extensions/nice-polyglot/nice-polyglot-config.yml
#
#   Project layer  (per-project settings, committed to the project repo):
#     .specify/overrides/nice-polyglot-config.yml
#
#   User layer  (personal preferences, not committed):
#     .specify/.nice-polyglot/{user}-config.yml
#       where {user} is derived from git config user.email (sanitised) or
#       $env:USERNAME / $env:USER / "unknown" as fallbacks.
#
# All fields are optional. Missing fields fall through to the lower-precedence layer.
# When no config files are present the extension uses hardcoded defaults (all categories: en).
#
# For full details see docs/configuration.md (EN) or docs/configuration.fr.md (FR).

# schema_version: "1.0"

# ---------------------------------------------------------------------------
# accepted_languages
# ---------------------------------------------------------------------------
# AUTHORITATIVE at the project layer.
# The extension layer may also set this to establish shared defaults across
# all projects in a shared .specify/ root.
# The user layer IGNORES this field (it is silently discarded with a warning).
#
# Rules:
#   - Values must be ISO 639-1 two-letter lowercase codes (e.g. en, fr, es, pt, de, fi, hi).
#   - "en" is always present in the effective list; add it explicitly to be clear.
#   - Any unrecognised code makes the entire layer invalid; the layer is discarded
#     and a warning is written to stderr.
#   - An empty list is treated as [en].
#
# accepted_languages:
#   - en       # English — always the fallback
#   - fr       # Example: add French

# ---------------------------------------------------------------------------
# language_settings
# ---------------------------------------------------------------------------
# language_settings:

  # Conversational language for agent-to-user interaction.
  # NOT constrained by accepted_languages — any ISO 639-1 two-letter code is accepted.
  # interactions: en

  # Language for SpecKit artifact files (spec.md, plan.md, tasks.md, etc.).
  # Must be in accepted_languages (project layer) or falls back to "en".
  # artifacts: en

  # Language for user-facing documentation generated by agents.
  # Must be in accepted_languages (project layer) or falls back to "en".
  # documentation: en

  # Language for generated source code.
  # Must be in accepted_languages (project layer) or falls back to "en".
  # code: en

  # Language for comments inside generated source code.
  # Must be in accepted_languages (project layer) or falls back to "en".
  # code-comments: en

  # Language for log output messages generated by agents.
  # Must be in accepted_languages (project layer) or falls back to "en".
  # log-messages: en

  # Language for internal/developer-facing documentation.
  # Must be in accepted_languages (project layer) or falls back to "en".
  # internal-docs: en

  # Language for git commit messages generated by agents.
  # Must be in accepted_languages (project layer) or falls back to "en".
  # commit-messages: en
